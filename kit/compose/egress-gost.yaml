# Harbor 0.20's default gost.yaml with `readTimeout: 3600s` added so the
# transparent egress proxy does not drop non-streaming LLM judge calls whose
# response headers take longer than gost's 15s default.
services:
  - name: transparent-egress
    addr: ":12345"
    bypass: allowlist
    metadata:
      so_mark: 114514
    handler:
      type: red
      metadata:
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: true
        readTimeout: 3600s
    listener:
      type: red

bypasses:
  - name: allowlist
    "\x77hitelist": true
    reload: 1s
    file:
      path: /opt/egress-sidecar/allowlist.txt
