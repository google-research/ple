# Harbor 0.20's harbor-docker-egress-control-sidecar/gost.yaml with one addition, `readTimeout`: how long the egress
# sidecar's transparent proxy waits for an HTTP response's headers. gost's default is 15 s, after which it closes the
# client's connection, and a judge answering a long rubric in one call (fire-test-validation-memo's 48 criteria) takes
# longer: the verifier then saw "Remote end closed connection without response". A response body may stay silent for
# any time already; this only lets its headers take as long. Mounted over the sidecar's own file by
# docker-compose-egress-gost.yaml (kit/harbor_docker.py). Everything else is Harbor's file verbatim.
services:
  - name: transparent-egress
    addr: ":12345"
    bypass: allowlist
    metadata:
      so_mark: 114514
    handler:
      type: red
      metadata:
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: true
        readTimeout: 3600s
    listener:
      type: red

bypasses:
  - name: allowlist
    "\x77hitelist": true
    reload: 1s
    file:
      path: /opt/egress-sidecar/allowlist.txt
