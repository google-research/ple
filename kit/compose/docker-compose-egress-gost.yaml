# Overlay added by kit/harbor_docker.py when egress control is enabled: mounts
# egress-gost.yaml over Harbor's default gost config so the sidecar waits up to
# 1 hour (instead of 15s) for LLM judge response headers.
services:
  harbor-docker-egress-control-sidecar:
    volumes:
      - ${PLEBENCH_EGRESS_GOST_CONFIG:?set by kit.harbor_docker}:/opt/egress-sidecar/gost.yaml:ro
