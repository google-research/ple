# Laid over Harbor's egress-control compose file by kit/harbor_docker.py: the sidecar's gost reads egress-gost.yaml,
# which waits up to an hour for a response's headers instead of 15 s (that file says why). The path is absolute, from
# the environment class, because compose resolves a relative one against the task's environment directory.
services:
  harbor-docker-egress-control-sidecar:
    volumes:
      - ${PLEBENCH_EGRESS_GOST_CONFIG:?set by kit.harbor_docker}:/opt/egress-sidecar/gost.yaml:ro
