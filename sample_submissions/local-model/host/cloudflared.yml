# A named Cloudflare Tunnel from llm.example.org to the gate, for a domain whose DNS is on Cloudflare. Set it up once:
#   cloudflared tunnel login
#   cloudflared tunnel create llm        # prints the tunnel ID and writes ~/.cloudflared/<tunnel ID>.json
#   cloudflared tunnel route dns llm llm.example.org
# then run: cloudflared tunnel --config cloudflared.yml run
tunnel: <tunnel ID>
credentials-file: /home/<you>/.cloudflared/<tunnel ID>.json
ingress:
  - hostname: llm.example.org
    service: http://127.0.0.1:8090
  - service: http_status:404
