[project]
name = "plebench"
version = "0.1.0"
description = "Submission kit, sample harnesses and dev-set evaluation for the Physical-Engineering’s Last Exam harness competition"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND CC-BY-4.0"
dependencies = ["pyyaml>=6.0", "websockets>=13.0", "python-dotenv>=1.0", "huggingface-hub>=1.31,<2",
                "tomli>=2.0; python_version < '3.11'"]

[tool.uv]
package = false
